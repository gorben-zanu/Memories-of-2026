<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>keepsakes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1432; --pearl:#EAF0FF; --silver:#B9C6E4; --mist:#8FA0C8; --cran:#C41E45; --cran-soft:#FF8FA8;
  --serif:"Cormorant Garamond",Georgia,serif; --sans:"Figtree",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;color-scheme:dark}
body{
  min-height:100vh; font-family:var(--sans); color:var(--pearl); line-height:1.5;
  background:
    radial-gradient(60rem 32rem at 18% -5%, #2B4584 0%, transparent 62%),
    radial-gradient(50rem 36rem at 95% 25%, #1D3166 0%, transparent 62%),
    radial-gradient(70rem 40rem at 50% 112%, #3D5496 0%, transparent 62%),
    var(--navy);
  background-attachment:fixed;
}
/* drifting night-sea clouds, kept behind the content so photos stay untouched */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;mix-blend-mode:screen;
  background-size:cover;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='800' preserveAspectRatio='none'><filter id='c' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.004 .009' numOctaves='5' seed='7'/><feColorMatrix values='0 0 0 0 .62 0 0 0 0 .72 0 0 0 0 .95 0 0 0 1.5 -.55'/></filter><rect width='100%' height='100%' filter='url(%23c)'/></svg>");
}
header{max-width:72rem;margin:0 auto;padding:clamp(2.5rem,8vw,6rem) 1.5rem 1.5rem}
h1{
  font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(4rem,16vw,10.5rem);
  line-height:.85;letter-spacing:-.02em;color:var(--pearl);
  text-shadow:0 0 34px rgba(150,180,255,.45),0 0 90px rgba(120,150,255,.3);
  animation:rise 1.4s cubic-bezier(.2,.7,.2,1) both;
}
.sub{margin-top:1.4rem;color:var(--mist);font-size:1rem;letter-spacing:.05em;max-width:36ch}
nav{display:flex;gap:.6rem;margin-top:2rem;flex-wrap:wrap}
nav button{
  font:500 .95rem var(--sans);letter-spacing:.06em;color:var(--pearl);background:transparent;
  border:1px solid rgba(185,198,228,.5);border-radius:999px;padding:.5rem 1.3rem;cursor:pointer;
  transition:background .3s,color .3s,box-shadow .3s;
}
nav button[aria-pressed="true"]{background:var(--cran);border-color:var(--cran);color:#fff}
nav button:hover:not([aria-pressed="true"]){background:rgba(185,198,228,.14);box-shadow:0 0 26px -4px rgba(150,180,255,.6)}
:focus-visible{outline:2px solid var(--cran-soft);outline-offset:3px}
main{max-width:72rem;margin:0 auto;padding:1.5rem 1.5rem 6rem}
.pictures{columns:3 16rem;column-gap:1.75rem}
.videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,20rem),1fr));gap:2rem 1.75rem}
/* film-strip frames */
.card{
  position:relative;display:block;width:100%;break-inside:avoid;margin:0 0 2rem;padding:1.75rem .6rem;
  background:linear-gradient(180deg,#121F4A,#0C1638);border:1px solid rgba(185,198,228,.18);border-radius:3px;
  text-align:left;cursor:pointer;font:inherit;color:inherit;
  box-shadow:0 22px 40px -18px rgba(0,0,0,.8),0 0 38px -12px rgba(140,170,255,.35);
  transform:rotate(var(--tilt,0deg));transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s;
}
.card::before,.card::after{
  content:"";position:absolute;left:.5rem;right:.5rem;height:.55rem;
  background:repeating-linear-gradient(90deg,rgba(220,230,250,.85) 0 .7rem,transparent .7rem 1.35rem);
  border-radius:1px;
}
.card::before{top:.6rem}.card::after{bottom:.6rem}
.card:nth-child(4n+1){--tilt:-1deg}.card:nth-child(4n+2){--tilt:.8deg}
.card:nth-child(4n+3){--tilt:-.4deg}.card:nth-child(4n){--tilt:1.2deg}
.card:hover{transform:rotate(0) translateY(-6px);box-shadow:0 28px 48px -16px rgba(0,0,0,.85),0 0 64px -8px rgba(150,180,255,.55)}
.card img,.card video{display:block;width:100%;height:auto;background:#142350}
.videos .card video{aspect-ratio:16/9;object-fit:cover;pointer-events:none}
.thumb{position:relative}
.play{position:absolute;inset:0;display:grid;place-items:center}
.play span{width:3.4rem;height:3.4rem;border-radius:50%;background:rgba(234,240,255,.92);display:grid;place-items:center;box-shadow:0 0 30px rgba(150,180,255,.7),0 6px 18px rgba(0,0,0,.4)}
.play svg{width:1.1rem;margin-left:.2rem;fill:var(--cran)}
.empty{padding:3rem 0;color:var(--mist);max-width:36ch}
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100vw;height:100vh;color:var(--pearl)}
dialog::backdrop{background:rgba(4,9,26,.93);backdrop-filter:blur(10px)}
.box{height:100%;display:grid;grid-template-rows:1fr auto;padding:3.5rem 1rem 1rem}
.stage{display:grid;place-items:center;min-height:0}
.stage img,.stage video{max-width:100%;max-height:100%;border-radius:2px;box-shadow:0 0 90px -10px rgba(130,165,255,.4),0 20px 60px rgba(0,0,0,.6)}
.bar{display:flex;justify-content:center;gap:1rem;padding-top:.9rem;font-size:.9rem;letter-spacing:.1em;color:var(--mist)}
.ctl{position:absolute;border:1px solid rgba(185,198,228,.3);border-radius:50%;width:2.8rem;height:2.8rem;background:rgba(185,198,228,.08);color:var(--pearl);font-size:1.4rem;cursor:pointer;line-height:1;transition:background .3s}
.ctl:hover{background:rgba(196,30,69,.55)}
.x{top:.9rem;right:.9rem}.prev{left:.9rem;top:50%}.next{right:.9rem;top:50%}
@keyframes rise{from{opacity:0;transform:translateY(24px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@media (max-width:520px){.pictures{columns:2 9rem;column-gap:1rem}.card{margin-bottom:1.25rem;padding:1.5rem .45rem}.card::before,.card::after{height:.45rem}.prev,.next{top:auto;bottom:4rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>



</head>
<body>
<header>
  <h1>keepsakes</h1>
  <p class="sub" id="count">Loading your memories…</p>
  <nav aria-label="Gallery">
    <button id="tab-pictures" aria-pressed="true">Pictures</button>
    <button id="tab-videos" aria-pressed="false">Videos</button>
  </nav>
</header>
<main id="grid"></main>

<dialog id="lb" aria-label="Viewer">
  <button class="ctl x" aria-label="Close">&times;</button>
  <button class="ctl prev" aria-label="Previous">&#8249;</button>
  <button class="ctl next" aria-label="Next">&#8250;</button>
  <div class="box"><div class="stage"></div><div class="bar"><span id="pos"></span></div></div>
</dialog>

<script>
const grid = document.getElementById('grid'), count = document.getElementById('count');
const dlg = document.getElementById('lb'), stage = dlg.querySelector('.stage');
const pos = document.getElementById('pos');
let data = { pictures: [], videos: [] }, view = 'pictures', list = [], idx = 0;

const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

function render() {
  const items = data[view];
  grid.className = view;
  grid.replaceChildren();
  document.getElementById('tab-pictures').setAttribute('aria-pressed', view === 'pictures');
  document.getElementById('tab-videos').setAttribute('aria-pressed', view === 'videos');
  if (!items.length) {
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = `Nothing here yet. Add files to the ${view === 'pictures' ? 'Pictures' : 'Videos'} folder and redeploy.`;
    grid.className = ''; grid.append(p); return;
  }
  items.forEach((it, i) => {
    const card = document.createElement('button');
    card.className = 'card';
    card.setAttribute('aria-label', `Open ${view === 'pictures' ? 'picture' : 'video'} ${i + 1}`);
    const thumb = document.createElement('div'); thumb.className = 'thumb';
    if (view === 'pictures') {
      const img = new Image(); img.src = it.src; img.alt = `Picture ${i + 1}`; img.loading = 'lazy'; img.decoding = 'async';
      thumb.append(img);
    } else {
      const v = document.createElement('video');
      v.src = it.src + '#t=0.5'; v.preload = 'metadata'; v.muted = true; v.playsInline = true;
      const play = document.createElement('div'); play.className = 'play';
      play.innerHTML = '<span><svg viewBox="0 0 10 12"><path d="M0 0l10 6-10 6z"/></svg></span>';
      thumb.append(v, play);
    }
    card.append(thumb);
    card.addEventListener('click', () => open(i));
    grid.append(card);
  });
}

function show() {
  stage.replaceChildren();
  const it = list[idx]; let el;
  if (view === 'pictures') { el = new Image(); el.alt = `Picture ${idx + 1}`; el.src = it.src; }
  else { el = document.createElement('video'); el.src = it.src; el.controls = true; el.autoplay = true; el.playsInline = true; }
  stage.append(el);
  pos.textContent = `${idx + 1} / ${list.length}`;
}
function open(i) { list = data[view]; idx = i; show(); dlg.showModal(); }
function step(d) { idx = (idx + d + list.length) % list.length; show(); }

dlg.querySelector('.x').onclick = () => dlg.close();
dlg.querySelector('.prev').onclick = () => step(-1);
dlg.querySelector('.next').onclick = () => step(1);
dlg.addEventListener('click', e => { if (!e.target.closest('img,video,button,.bar')) dlg.close(); });
dlg.addEventListener('close', () => stage.replaceChildren());
document.addEventListener('keydown', e => {
  if (!dlg.open) return;
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});
document.getElementById('tab-pictures').onclick = () => { view = 'pictures'; render(); };
document.getElementById('tab-videos').onclick = () => { view = 'videos'; render(); };

fetch('manifest.json').then(r => r.json()).then(m => {
  data = m;
  count.textContent = `${plural(m.pictures.length, 'picture')} and ${plural(m.videos.length, 'video')}, all in one place.`;
  render();
}).catch(() => { count.textContent = 'Could not load the gallery. Try refreshing the page.'; });
</script>
</body>
</html>

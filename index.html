<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>keepsakes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#E6ECF7; --ink:#1B2140; --rose:#E9A3B4; --butter:#F5E3A9; --paper:#FFFEFA; --muted:#5B6385;
  --serif:"Young Serif",Georgia,serif; --sans:"Figtree",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh; font-family:var(--sans); color:var(--ink); line-height:1.5;
  background:
    radial-gradient(60rem 40rem at 10% -10%, #F9DCE4 0%, transparent 60%),
    radial-gradient(50rem 40rem at 100% 0%, #FBF0C8 0%, transparent 55%),
    var(--sky);
  background-attachment:fixed;
}
header{max-width:72rem;margin:0 auto;padding:clamp(2.5rem,8vw,6rem) 1.5rem 1.5rem}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(3.5rem,14vw,9rem);line-height:.9;letter-spacing:-.03em;animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both}
.sub{margin-top:1.25rem;color:var(--muted);font-size:1.05rem;max-width:34ch}
nav{display:flex;gap:.5rem;margin-top:2rem;flex-wrap:wrap}
nav button{
  font:500 1rem var(--sans);color:var(--ink);background:transparent;border:1.5px solid var(--ink);
  border-radius:999px;padding:.55rem 1.25rem;cursor:pointer;transition:background .2s,color .2s;
}
nav button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
nav button:hover:not([aria-pressed="true"]){background:var(--butter)}
:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
main{max-width:72rem;margin:0 auto;padding:1.5rem 1.5rem 6rem}
.pictures{columns:3 16rem;column-gap:1.75rem}
.videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,20rem),1fr));gap:2rem 1.75rem}
.card{
  display:block;width:100%;break-inside:avoid;margin:0 0 2rem;padding:.7rem .7rem 2.2rem;background:var(--paper);
  border:0;border-radius:3px;text-align:left;cursor:pointer;font:inherit;color:inherit;
  box-shadow:0 1px 2px rgba(27,33,64,.12),0 14px 30px -12px rgba(27,33,64,.28);
  transform:rotate(var(--tilt,0deg));transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s;
}
.card:nth-child(4n+1){--tilt:-1.4deg}.card:nth-child(4n+2){--tilt:1deg}
.card:nth-child(4n+3){--tilt:-.5deg}.card:nth-child(4n){--tilt:1.6deg}
.card:hover{transform:rotate(0) translateY(-6px);box-shadow:0 2px 4px rgba(27,33,64,.12),0 24px 40px -14px rgba(27,33,64,.35)}
.card img,.card video{display:block;width:100%;height:auto;background:var(--sky);border-radius:1px}
.videos .card video{aspect-ratio:16/9;object-fit:cover;pointer-events:none}
.thumb{position:relative}
.play{position:absolute;inset:0;display:grid;place-items:center}
.play span{width:3.4rem;height:3.4rem;border-radius:50%;background:rgba(255,254,250,.92);display:grid;place-items:center;box-shadow:0 6px 18px rgba(27,33,64,.3)}
.play svg{width:1.2rem;margin-left:.2rem;fill:var(--ink)}
.empty{padding:3rem 0;color:var(--muted);max-width:36ch}
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100vw;height:100vh;color:var(--paper)}
dialog::backdrop{background:rgba(27,33,64,.9);backdrop-filter:blur(8px)}
.box{height:100%;display:grid;grid-template-rows:1fr auto;padding:3.5rem 1rem 1rem}
.stage{display:grid;place-items:center;min-height:0}
.stage img,.stage video{max-width:100%;max-height:100%;border-radius:3px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.bar{display:flex;justify-content:center;gap:1rem;padding-top:.9rem;font-size:.95rem;opacity:.85}
.ctl{position:absolute;border:0;border-radius:50%;width:2.8rem;height:2.8rem;background:rgba(255,254,250,.14);color:var(--paper);font-size:1.4rem;cursor:pointer;line-height:1}
.ctl:hover{background:rgba(255,254,250,.28)}
.x{top:.9rem;right:.9rem}.prev{left:.9rem;top:50%}.next{right:.9rem;top:50%}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media (max-width:520px){.pictures{columns:2 9rem;column-gap:1rem}.card{margin-bottom:1.25rem}.prev,.next{top:auto;bottom:4rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
  <h1>keepsakes</h1>
  <p class="sub" id="count">Loading your memories…</p>
  <nav aria-label="Gallery">
    <button id="tab-pictures" aria-pressed="true">Pictures</button>
    <button id="tab-videos" aria-pressed="false">Videos</button>
  </nav>
</header>
<main id="grid"></main>

<dialog id="lb" aria-label="Viewer">
  <button class="ctl x" aria-label="Close">&times;</button>
  <button class="ctl prev" aria-label="Previous">&#8249;</button>
  <button class="ctl next" aria-label="Next">&#8250;</button>
  <div class="box"><div class="stage"></div><div class="bar"><span id="pos"></span></div></div>
</dialog>

<script>
const grid = document.getElementById('grid'), count = document.getElementById('count');
const dlg = document.getElementById('lb'), stage = dlg.querySelector('.stage');
const pos = document.getElementById('pos');
let data = { pictures: [], videos: [] }, view = 'pictures', list = [], idx = 0;

const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

function render() {
  const items = data[view];
  grid.className = view;
  grid.replaceChildren();
  document.getElementById('tab-pictures').setAttribute('aria-pressed', view === 'pictures');
  document.getElementById('tab-videos').setAttribute('aria-pressed', view === 'videos');
  if (!items.length) {
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = `Nothing here yet. Add files to the ${view === 'pictures' ? 'Pictures' : 'Videos'} folder and redeploy.`;
    grid.className = ''; grid.append(p); return;
  }
  items.forEach((it, i) => {
    const card = document.createElement('button');
    card.className = 'card';
    card.setAttribute('aria-label', `Open ${view === 'pictures' ? 'picture' : 'video'} ${i + 1}`);
    const thumb = document.createElement('div'); thumb.className = 'thumb';
    if (view === 'pictures') {
      const img = new Image(); img.src = it.src; img.alt = `Picture ${i + 1}`; img.loading = 'lazy'; img.decoding = 'async';
      thumb.append(img);
    } else {
      const v = document.createElement('video');
      v.src = it.src + '#t=0.5'; v.preload = 'metadata'; v.muted = true; v.playsInline = true;
      const play = document.createElement('div'); play.className = 'play';
      play.innerHTML = '<span><svg viewBox="0 0 10 12"><path d="M0 0l10 6-10 6z"/></svg></span>';
      thumb.append(v, play);
    }
    card.append(thumb);
    card.addEventListener('click', () => open(i));
    grid.append(card);
  });
}

function show() {
  stage.replaceChildren();
  const it = list[idx]; let el;
  if (view === 'pictures') { el = new Image(); el.alt = `Picture ${idx + 1}`; el.src = it.src; }
  else { el = document.createElement('video'); el.src = it.src; el.controls = true; el.autoplay = true; el.playsInline = true; }
  stage.append(el);
  pos.textContent = `${idx + 1} / ${list.length}`;
}
function open(i) { list = data[view]; idx = i; show(); dlg.showModal(); }
function step(d) { idx = (idx + d + list.length) % list.length; show(); }

dlg.querySelector('.x').onclick = () => dlg.close();
dlg.querySelector('.prev').onclick = () => step(-1);
dlg.querySelector('.next').onclick = () => step(1);
dlg.addEventListener('click', e => { if (!e.target.closest('img,video,button,.bar')) dlg.close(); });
dlg.addEventListener('close', () => stage.replaceChildren());
document.addEventListener('keydown', e => {
  if (!dlg.open) return;
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});
document.getElementById('tab-pictures').onclick = () => { view = 'pictures'; render(); };
document.getElementById('tab-videos').onclick = () => { view = 'videos'; render(); };

fetch('manifest.json').then(r => r.json()).then(m => {
  data = m;
  count.textContent = `${plural(m.pictures.length, 'picture')} and ${plural(m.videos.length, 'video')}, all in one place.`;
  render();
}).catch(() => { count.textContent = 'Could not load the gallery. Try refreshing the page.'; });
</script>
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</body>
</html>

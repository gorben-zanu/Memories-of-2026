<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>keepsakes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FFFBF1; --haze:#F8EEDD; --ink:#4A5728; --mist:#6A6A44; --olive:#56632F;
  --sun:#FFD98A; --pink:#D96A8E; --leaf:#A9C47A;
  --serif:"Cormorant Garamond",Georgia,serif; --sans:"Figtree",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh; font-family:var(--sans); color:var(--ink); line-height:1.5;
  background:
    radial-gradient(48rem 36rem at 95% -5%, rgba(255,225,150,.95) 0%, transparent 62%),
    radial-gradient(40rem 32rem at 12% 18%, rgba(240,170,200,.32) 0%, transparent 62%),
    radial-gradient(55rem 40rem at 0% 105%, rgba(160,195,110,.5) 0%, transparent 62%),
    radial-gradient(40rem 30rem at 100% 100%, rgba(150,185,190,.35) 0%, transparent 62%),
    var(--haze);
  background-attachment:fixed;
}
/* soft film grain + warm vignette */
body::before,body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50}
body::before{
  opacity:.14;mix-blend-mode:soft-light;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4 0 0 0 0 .3 0 0 0 0 .2 0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
body::after{background:radial-gradient(ellipse at center, transparent 60%, rgba(150,105,50,.16) 100%)}
header{max-width:72rem;margin:0 auto;padding:clamp(2.5rem,8vw,6rem) 1.5rem 1.5rem}
h1{
  font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(4rem,16vw,10.5rem);
  line-height:.85;letter-spacing:-.02em;color:var(--ink);
  text-shadow:0 0 30px rgba(255,214,130,.95),0 0 80px rgba(255,200,120,.6);
  animation:rise 1.4s cubic-bezier(.2,.7,.2,1) both;
}
.sub{margin-top:1.4rem;color:var(--mist);font-size:1rem;letter-spacing:.03em;max-width:36ch}
nav{display:flex;gap:.6rem;margin-top:2rem;flex-wrap:wrap}
nav button{
  font:500 .95rem var(--sans);letter-spacing:.05em;color:var(--ink);background:rgba(255,251,241,.35);
  border:1px solid rgba(86,99,47,.5);border-radius:999px;padding:.5rem 1.3rem;cursor:pointer;
  transition:background .3s,color .3s,box-shadow .3s;
}
nav button[aria-pressed="true"]{background:var(--olive);color:var(--cream);border-color:var(--olive)}
nav button:hover:not([aria-pressed="true"]){background:rgba(255,217,138,.5);box-shadow:0 0 26px -4px rgba(255,190,90,.7)}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
main{max-width:72rem;margin:0 auto;padding:1.5rem 1.5rem 6rem}
.pictures{columns:3 16rem;column-gap:1.75rem}
.videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,20rem),1fr));gap:2rem 1.75rem}
.card{
  display:block;width:100%;break-inside:avoid;margin:0 0 2rem;padding:.6rem .6rem 2.1rem;
  background:var(--cream);border:1px solid rgba(150,120,60,.16);border-radius:3px;
  text-align:left;cursor:pointer;font:inherit;color:inherit;
  box-shadow:0 18px 34px -16px rgba(120,85,30,.45),0 0 40px -10px rgba(255,200,110,.5);
  transform:rotate(var(--tilt,0deg));transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s;
}
.card:nth-child(4n+1){--tilt:-1.2deg}.card:nth-child(4n+2){--tilt:.9deg}
.card:nth-child(4n+3){--tilt:-.5deg}.card:nth-child(4n){--tilt:1.3deg}
.card:hover{transform:rotate(0) translateY(-6px);box-shadow:0 26px 44px -16px rgba(120,85,30,.5),0 0 64px -8px rgba(255,195,100,.75)}
.card img,.card video{display:block;width:100%;height:auto;background:#EADFC8;filter:saturate(1.05) contrast(.96) brightness(1.03) sepia(.08);transition:filter .6s}
.card:hover img,.card:hover video{filter:none}
.videos .card video{aspect-ratio:16/9;object-fit:cover;pointer-events:none}
.thumb{position:relative;overflow:hidden}
/* warm haze + sun leak that melt away on hover */
.thumb::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 88% 6%,rgba(255,238,175,.85),transparent 55%);mix-blend-mode:screen;opacity:.8;transition:opacity .6s;pointer-events:none}
.thumb::after{content:"";position:absolute;inset:0;background:#FFC878;mix-blend-mode:soft-light;opacity:.5;transition:opacity .6s;pointer-events:none}
.card:hover .thumb::before,.card:hover .thumb::after{opacity:0}
.play{position:absolute;inset:0;display:grid;place-items:center;z-index:1}
.play span{width:3.4rem;height:3.4rem;border-radius:50%;background:rgba(255,251,241,.88);display:grid;place-items:center;box-shadow:0 0 30px rgba(255,200,110,.8),0 6px 18px rgba(90,60,20,.3)}
.play svg{width:1.1rem;margin-left:.2rem;fill:var(--olive)}
.empty{padding:3rem 0;color:var(--mist);max-width:36ch}
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100vw;height:100vh;color:var(--cream)}
dialog::backdrop{background:rgba(42,34,18,.9);backdrop-filter:blur(10px)}
.box{height:100%;display:grid;grid-template-rows:1fr auto;padding:3.5rem 1rem 1rem}
.stage{display:grid;place-items:center;min-height:0}
.stage img,.stage video{max-width:100%;max-height:100%;border-radius:3px;box-shadow:0 0 90px -10px rgba(255,200,110,.45),0 20px 60px rgba(0,0,0,.5)}
.bar{display:flex;justify-content:center;gap:1rem;padding-top:.9rem;font-size:.9rem;letter-spacing:.1em;color:rgba(255,251,241,.75)}
.ctl{position:absolute;border:1px solid rgba(255,251,241,.3);border-radius:50%;width:2.8rem;height:2.8rem;background:rgba(255,251,241,.08);color:var(--cream);font-size:1.4rem;cursor:pointer;line-height:1;transition:background .3s}
.ctl:hover{background:rgba(255,217,138,.3)}
.x{top:.9rem;right:.9rem}.prev{left:.9rem;top:50%}.next{right:.9rem;top:50%}
@keyframes rise{from{opacity:0;transform:translateY(24px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@media (max-width:520px){.pictures{columns:2 9rem;column-gap:1rem}.card{margin-bottom:1.25rem}.prev,.next{top:auto;bottom:4rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>


</head>
<body>
<header>
  <h1>keepsakes</h1>
  <p class="sub" id="count">Loading your memories…</p>
  <nav aria-label="Gallery">
    <button id="tab-pictures" aria-pressed="true">Pictures</button>
    <button id="tab-videos" aria-pressed="false">Videos</button>
  </nav>
</header>
<main id="grid"></main>

<dialog id="lb" aria-label="Viewer">
  <button class="ctl x" aria-label="Close">&times;</button>
  <button class="ctl prev" aria-label="Previous">&#8249;</button>
  <button class="ctl next" aria-label="Next">&#8250;</button>
  <div class="box"><div class="stage"></div><div class="bar"><span id="pos"></span></div></div>
</dialog>

<script>
const grid = document.getElementById('grid'), count = document.getElementById('count');
const dlg = document.getElementById('lb'), stage = dlg.querySelector('.stage');
const pos = document.getElementById('pos');
let data = { pictures: [], videos: [] }, view = 'pictures', list = [], idx = 0;

const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

function render() {
  const items = data[view];
  grid.className = view;
  grid.replaceChildren();
  document.getElementById('tab-pictures').setAttribute('aria-pressed', view === 'pictures');
  document.getElementById('tab-videos').setAttribute('aria-pressed', view === 'videos');
  if (!items.length) {
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = `Nothing here yet. Add files to the ${view === 'pictures' ? 'Pictures' : 'Videos'} folder and redeploy.`;
    grid.className = ''; grid.append(p); return;
  }
  items.forEach((it, i) => {
    const card = document.createElement('button');
    card.className = 'card';
    card.setAttribute('aria-label', `Open ${view === 'pictures' ? 'picture' : 'video'} ${i + 1}`);
    const thumb = document.createElement('div'); thumb.className = 'thumb';
    if (view === 'pictures') {
      const img = new Image(); img.src = it.src; img.alt = `Picture ${i + 1}`; img.loading = 'lazy'; img.decoding = 'async';
      thumb.append(img);
    } else {
      const v = document.createElement('video');
      v.src = it.src + '#t=0.5'; v.preload = 'metadata'; v.muted = true; v.playsInline = true;
      const play = document.createElement('div'); play.className = 'play';
      play.innerHTML = '<span><svg viewBox="0 0 10 12"><path d="M0 0l10 6-10 6z"/></svg></span>';
      thumb.append(v, play);
    }
    card.append(thumb);
    card.addEventListener('click', () => open(i));
    grid.append(card);
  });
}

function show() {
  stage.replaceChildren();
  const it = list[idx]; let el;
  if (view === 'pictures') { el = new Image(); el.alt = `Picture ${idx + 1}`; el.src = it.src; }
  else { el = document.createElement('video'); el.src = it.src; el.controls = true; el.autoplay = true; el.playsInline = true; }
  stage.append(el);
  pos.textContent = `${idx + 1} / ${list.length}`;
}
function open(i) { list = data[view]; idx = i; show(); dlg.showModal(); }
function step(d) { idx = (idx + d + list.length) % list.length; show(); }

dlg.querySelector('.x').onclick = () => dlg.close();
dlg.querySelector('.prev').onclick = () => step(-1);
dlg.querySelector('.next').onclick = () => step(1);
dlg.addEventListener('click', e => { if (!e.target.closest('img,video,button,.bar')) dlg.close(); });
dlg.addEventListener('close', () => stage.replaceChildren());
document.addEventListener('keydown', e => {
  if (!dlg.open) return;
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});
document.getElementById('tab-pictures').onclick = () => { view = 'pictures'; render(); };
document.getElementById('tab-videos').onclick = () => { view = 'videos'; render(); };

fetch('manifest.json').then(r => r.json()).then(m => {
  data = m;
  count.textContent = `${plural(m.pictures.length, 'picture')} and ${plural(m.videos.length, 'video')}, all in one place.`;
  render();
}).catch(() => { count.textContent = 'Could not load the gallery. Try refreshing the page.'; });
</script>
</body>
</html>
